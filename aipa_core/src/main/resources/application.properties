spring.application.name=aipa
spring.config.import=optional:classpath:database_user.properties
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
spring.web.resources.static-locations=${AIPA_STATIC_LOCATIONS:file:./app/client/,classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/}
aipa.desktop.enabled=${AIPA_DESKTOP_MODE:false}
aipa.desktop.open-ui=${AIPA_DESKTOP_OPEN_UI:true}
aipa.user-store.path=${AIPA_USER_STORE_PATH:}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${AIPA_MAIL_USERNAME:}
spring.mail.password=${AIPA_MAIL_PASSWORD:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.jwt.secret=ZGljaG9uZ3RhaS1haXBhLXNlY3JldC1rZXktZm9yLWp3dC0yMDI2LTAyLTI1
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=2592000000
auth.face-login-threshold=0.82

# Python controll service base URL (used by /api/face/* proxy endpoints).
aipa.controll.base-url=${AIPA_CONTROLL_URL:http://127.0.0.1:8001}
